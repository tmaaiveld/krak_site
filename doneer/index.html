<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Doneer aan KRAK!</title>
    <style>
        :root { --bg: #f7f1e6; --ink: #1a1816; --ink-soft: #4a443e; --accent: #b95e3e; --accent-dark: #8f3f2c; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
            box-sizing: border-box; background: var(--bg); color: var(--ink);
            font-family: Georgia, "Times New Roman", serif; text-align: center;
        }
        h1 { font-family: system-ui, sans-serif; font-weight: 800; letter-spacing: 0.02em; margin: 0 0 12px; }
        p { color: var(--ink-soft); margin: 0 0 20px; }
        a.button {
            display: inline-block; padding: 14px 28px; border-radius: 999px; background: var(--accent);
            color: #fff; text-decoration: none; font-family: system-ui, sans-serif; font-weight: 600;
        }
        a.button:hover { background: var(--accent-dark); }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <h1>KRAK!</h1>
        <p id="status">Je wordt doorgestuurd naar Tikkie&hellip;</p>
        <a id="pay" class="button" href="#" hidden>Doneer via Tikkie</a>
        <noscript><p>Zet JavaScript aan om door te gaan, of vraag de band om de Tikkie-link.</p></noscript>
    </main>
    <script>
        // The Tikkie link lives in /doneer/link.txt. Edit that file before each gig.
        fetch('link.txt', { cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(function (text) {
                var url = text.trim();
                if (!/^https:\/\/tikkie\.me\/pay\//.test(url) || /JOUWCODE/.test(url)) throw new Error('bad link');
                var pay = document.getElementById('pay');
                pay.href = url;
                pay.hidden = false;
                window.location.replace(url);
            })
            .catch(function () {
                document.getElementById('status').textContent =
                    'Doneren kan op dit moment niet via deze link. Vraag de band even om de Tikkie!';
            });
    </script>
</body>
</html>
